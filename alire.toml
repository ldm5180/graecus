name = "graecus"
description = "SPARK-proven Black-Scholes IV and delta for index options"
version = "0.1.0"

authors = ["Lenny Maiorani"]
maintainers = ["Lenny Maiorani <639247+ldm5180@users.noreply.github.com>"]
maintainers-logins = ["ldm5180"]
licenses = "MIT"
website = "https://github.com/ldm5180/graecus"
tags = ["options", "black-scholes", "greeks", "finance", "spark"]

project-files = ["graecus.gpr"]

#  The library itself depends on nothing but the Ada standard library --
#  deliberately: consumers subtype Option_Right from here, so this crate
#  must never grow a transitive dependency.  AUnit and fabula are
#  tests-only: graecus.gpr withs neither, so a consumer's build of the
#  library links nothing new.
[[depends-on]]
aunit = "^26.0.0"
fabula = "*"

#  fabula, the Gherkin runner the features under tests/features/ run on,
#  is not in the community index; pin it to an exact commit so a build is
#  reproducible from this file alone.  It brings sml, pinned at the commit
#  every ldm5180 sibling pins -- alr refuses two links to one crate at
#  different commits, so a consumer workspace must carry the same one.
[[pins]]
fabula = { url = "https://github.com/ldm5180/fabula.git", commit = "746a234df5581c2e38c4202aeee8b07473fb6a51" }

[build-switches]
"*".ada_version = "Ada2022"

#  `alr test` runs actions with an empty GPR_PROJECT_PATH, so each wraps its
#  command in `alr exec --` to pick up the toolchain and AUnit.  Argv-only
#  actions (no `sh -c`, no `&&`) so this runs on Windows too; the runner
#  exits non-zero on any failing assertion, so a failure fails the job.
#  The suite is built and run in both optimization modes (release -O3,
#  debug -O0), selected by the MODE external (sml-ada convention).
[[actions]]
type = "test"
command = ["alr", "exec", "--", "gprbuild", "-p", "-j0", "-XMODE=release", "-P", "tests/test_graecus.gpr"]

[[actions]]
type = "test"
command = ["alr", "exec", "--", "tests/bin/release/test_runner"]

[[actions]]
type = "test"
command = ["alr", "exec", "--", "gprbuild", "-p", "-j0", "-XMODE=debug", "-P", "tests/test_graecus.gpr"]

[[actions]]
type = "test"
command = ["alr", "exec", "--", "tests/bin/debug/test_runner"]

#  The Gherkin features, after the suite: each gprbuild above already
#  built graecus_features beside test_runner.  fabula exits 1 on any
#  failed or undefined scenario; `make features` also checks the summary
#  line, since a missing path or an empty file exits 0 by design.
[[actions]]
type = "test"
command = ["alr", "exec", "--", "tests/bin/release/graecus_features", "tests/features"]

[[actions]]
type = "test"
command = ["alr", "exec", "--", "tests/bin/debug/graecus_features", "tests/features"]
